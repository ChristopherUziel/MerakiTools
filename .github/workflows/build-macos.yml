name: Compilar MerakiTools para macOS

on:
  workflow_dispatch:

jobs:
  compilar-macos:
    runs-on: macos-26

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxis
        run: |
          python -m compileall -q .

      - name: Compilar MerakiTools
        run: |
          python -m PyInstaller \
            --name MerakiTools \
            --console \
            --onedir \
            --clean \
            --noconfirm \
            Menu.py

      - name: Empaquetar compilación
        run: |
          cd dist
          tar -czf MerakiTools-macOS-arm64.tar.gz MerakiTools

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MerakiTools-macOS-arm64
          path: dist/MerakiTools-macOS-arm64.tar.gz
          if-no-files-found: error